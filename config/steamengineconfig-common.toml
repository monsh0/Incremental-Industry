
#Some changes may require restart.
[steam_engine]

	[steam_engine.heat]
		#Passive blocks (eg campfire) heat mode
		#Allowed Values: DISABLED, PASSIVE, ACTIVE
		passive_source_heat = "DISABLED"
		#Unlit blaze burner heat mode
		#Allowed Values: DISABLED, PASSIVE, ACTIVE
		unlit_burner_heat = "DISABLED"
		#Lit blaze burner heat level
		#Range: > 1
		lit_burner_heat = 1
		#Superheated blaze burner heat level
		#Range: > 2
		superheated_burner_heat = 2

	[steam_engine.boiler]
		#Water consumed per tick per heat level (mB)
		#Range: > 0
		water_per_tick = 10
		#Base RPM at full heat
		#Range: > -2147483647
		engine_rpm = 32
		#Heat levels utilized per engine
		#Range: 0.0 ~ 1.7976931348623157E308
		levels_per_engine = 2.0
		#Passive mode efficiency (0.0 = no power, 1.0 = full power)
		#Range: 0.0 ~ 1.0
		passive_efficiency = 0.0

["Create: Diesel Generators"]

	["Create: Diesel Generators".global]
		#Global RPM multiplier for all diesel engines
		#Range: -1.7976931348623157E308 ~ 1.7976931348623157E308
		global_rpm_multiplier = 1.0
		#Global stress multiplier for all diesel engines
		#Range: 0.0 ~ 1.7976931348623157E308
		global_stress_multiplier = 1.0
		#(BROKEN) Global fuel consumption multiplier for all diesel engines
		#Range: 0.0 ~ 1.7976931348623157E308
		global_fuel_multiplier = 1.0

	["Create: Diesel Generators".normal]
		#Normal diesel engine RPM multiplier
		#Range: -1.7976931348623157E308 ~ 1.7976931348623157E308
		rpm_multiplier = 1.5
		#Normal diesel engine stress multiplier
		#Range: 0.0 ~ 1.7976931348623157E308
		stress_multiplier = 1.0

	["Create: Diesel Generators".modular]
		#Modular diesel engine RPM multiplier
		#Range: -1.7976931348623157E308 ~ 1.7976931348623157E308
		rpm_multiplier = 1.75
		#Modular diesel engine stress multiplier
		#Range: 0.0 ~ 1.7976931348623157E308
		stress_multiplier = 1.0
		#Maximum length of modular diesel engines
		#Range: 1 ~ 21
		max_length = 21

	["Create: Diesel Generators".huge]
		#Huge diesel engine RPM multiplier
		#Range: -1.7976931348623157E308 ~ 1.7976931348623157E308
		rpm_multiplier = 1.5
		#Huge diesel engine stress multiplier
		#Range: 0.0 ~ 1.7976931348623157E308
		stress_multiplier = 1.0

	["Create: Diesel Generators".turbocharger]
		#Turbocharger RPM multiplier (overrides CDG's combined multiplier for speed)
		#Range: -1.7976931348623157E308 ~ 1.7976931348623157E308
		speed_multiplier = 2.0
		#Turbocharger stress capacity multiplier (overrides CDG's combined multiplier for stress)
		#Range: 0.0 ~ 1.7976931348623157E308
		stress_multiplier = 2.0
		#Enable turbocharger upgrades
		enabled = true

	["Create: Diesel Generators".burner]
		#(BROKEN) Multiplier for burner fuel strength (higher = more heat per fuel)
		#Range: 0.0 ~ 1.7976931348623157E308
		fuel_multiplier = 1.0
		#(BROKEN) Burner fluid tank capacity in mB
		#Range: > 1
		tank_capacity = 100
		#(BROKEN) Valve speed divisor (lower = faster response to RPM changes)
		#Range: 1.0 ~ 1.7976931348623157E308
		valve_speed_divisor = 5000.0
		#Fuel drained per tick when burner is active (mB)
		#Range: > 0
		drain_rate = 3
		#(BROKEN) Drain interval divisor (actual interval = this / valveState)
		#Range: > 1
		drain_interval = 10
		#(BROKEN) Valve state when redstone powered
		#Range: > 1
		redstone_valve_state = 20
		#Minimum heat for SEETHING state (maximum output)
		#Range: 0.0 ~ 1.7976931348623157E308
		seething_threshold = 2.0
		#Minimum heat for KINDLED state (high output)
		#Range: 0.0 ~ 1.7976931348623157E308
		kindled_threshold = 1.5
		#Minimum heat for FADING state (medium output)
		#Range: 0.0 ~ 1.7976931348623157E308
		fading_threshold = 1.3
		#Minimum heat for SMOULDERING state (low output)
		#Range: 0.0 ~ 1.7976931348623157E308
		smouldering_threshold = 1.0

