name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Install Packwiz
      run: go install github.com/packwiz/packwiz@latest

    - name: Refresh
      run: ~/go/bin/packwiz refresh

    - name: Export to Modrinth (mrpack)
      run: ~/go/bin/packwiz modrinth export

    - name: Export to CurseForge (zip)
      run: ~/go/bin/packwiz curseforge export

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          *.mrpack
          *.zip
          pack.toml
        generate_release_notes: true
