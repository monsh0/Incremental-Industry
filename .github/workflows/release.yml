name: Release Version

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build mrpack
        run: |
          zip -r -9 "../${{ github.event.repository.name }}-${{ github.ref_name }}.mrpack" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "*.mrpack" \
            -x "*.zip" \
            -x ".gitignore"
          mv "../${{ github.event.repository.name }}-${{ github.ref_name }}.mrpack" .

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ github.event.repository.name }}-${{ github.ref_name }}.mrpack
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
